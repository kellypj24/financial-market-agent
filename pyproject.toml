[tool.poetry]
name = "stock-market-agent"
version = "0.1.0"
description = "A stock market tracking agent using LangGraph for monitoring and analyzing market trends"
authors = ["kellypj24@gmail.com"]
readme = "README.md"
packages = [{include = "stock_tracker"}]

[tool.poetry.dependencies]
python = "^3.12"
langgraph = "^0.0.15"
langchain = "^0.1.0"
yfinance = "^0.2.36"
pandas = "^2.2.0"
numpy = "^1.26.0"
matplotlib = "^3.8.0"
pytest = "^8.0.0"
python-dotenv = "^1.0.0"
plotly = "^5.18.0"  # For interactive visualizations
requests = "^2.31.0"  # For API calls
rich = "^13.7.0"  # For better CLI output
pydantic = "^2.6.0"  # For data validation and modeling

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true 